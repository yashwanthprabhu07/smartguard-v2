<!-- @format -->

<!doctype html>
<html>
  <head>
    <title>SmartGuard AI Dashboard</title>

    <style>
      body {
        background: #111;
        color: white;
        text-align: center;
        font-family: Arial;
      }

      .card {
        background: #222;
        padding: 20px;
        margin: 20px auto;
        width: 350px;
        border-radius: 10px;
      }

      .healthy {
        color: lightgreen;
      }
      .warning {
        color: orange;
      }
      .critical {
        color: red;
      }

      button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }

      .btn-normal {
        background: lightgreen;
      }
      .btn-overheat {
        background: red;
        color: white;
      }
      .btn-vibration {
        background: orange;
      }
    </style>
  </head>

  <body>
    <h1>🚀 SmartGuard AI Dashboard</h1>

    <div class="card">
      <h2 id="machine">Loading...</h2>

      <p>🌡 Temperature: <span id="temp">--</span></p>
      <p>📊 Vibration: <span id="vib">--</span></p>
      <p>💯 Health Score: <span id="score">--</span></p>

      <p>📍 Status: <span id="status">--</span></p>

      <hr />

      <p>⚠️ Fault: <span id="fault">--</span></p>
      <p>🧠 Reason: <span id="reason">--</span></p>
      <p>📈 Confidence: <span id="confidence">--</span></p>
      <p>⚙️ Recommended Action: <span id="action">--</span></p>
      <p>⏳ Failure ETA: <span id="eta">--</span></p>
      <p>🤖 System Action: <span id="sys">--</span></p>
    </div>

    <hr />

    <h3>🎮 Demo Control Panel</h3>

    <button class="btn-normal" onclick="setMode('normal')">🟢 Normal</button>
    <button class="btn-overheat" onclick="setMode('overheat')">
      🔥 Overheat
    </button>
    <button class="btn-vibration" onclick="setMode('vibration')">
      ⚙️ Vibration Fault
    </button>

    <script>
      async function fetchData() {
        try {
          let res = await fetch("http://127.0.0.1:5000/data");
          let data = await res.json();

          // Basic data
          document.getElementById("machine").innerText = data.machine || "--";
          document.getElementById("temp").innerText =
            data.temperature?.toFixed(2) || "--";
          document.getElementById("vib").innerText =
            data.vibration?.toFixed(2) || "--";
          document.getElementById("score").innerText =
            data.health_score || "--";

          // Status
          let statusEl = document.getElementById("status");
          statusEl.innerText = data.status || "--";

          statusEl.className = "";
          if (data.status === "Healthy") statusEl.classList.add("healthy");
          if (data.status === "Warning") statusEl.classList.add("warning");
          if (data.status === "Critical") statusEl.classList.add("critical");

          // Explainable AI
          document.getElementById("fault").innerText = data.fault || "--";
          document.getElementById("reason").innerText = data.reason || "--";
          document.getElementById("confidence").innerText =
            data.confidence || "--";
          document.getElementById("action").innerText = data.action || "--";
          document.getElementById("eta").innerText = data.failure_time || "--";
          document.getElementById("sys").innerText = data.system_action || "--";
        } catch (err) {
          console.log("Error:", err);
        }
      }

      // Refresh every second
      setInterval(fetchData, 1000);

      // 🎮 Control API
      async function setMode(mode) {
        try {
          await fetch(`http://127.0.0.1:3000/set_mode?mode=${mode}`);
          console.log("Mode changed to:", mode);
        } catch (err) {
          console.log("Control error:", err);
        }
      }
    </script>
  </body>
</html>
